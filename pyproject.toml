[project]
name = "food-security-sandbox-backend"
version = "1.0.0"
description = "Food Security Sandbox app server: Tapis auth, chat, model registry and farmer-server gateway."
requires-python = ">=3.12,<3.13"
# Versions match the image deployed from year5_dev before the ICICLE CI/CD migration.
dependencies = [
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "flask-socketio==5.6.1",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "pydantic-settings==2.14.2",
    "pymongo==4.17.0",
    "python-dotenv==1.2.2",
    "python-jose==3.5.0",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
]

[tool.uv]
package = false
