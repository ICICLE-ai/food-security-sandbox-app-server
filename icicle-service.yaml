# ICICLE CI/CD config (cicd-templates v2.3.0): https://github.com/ICICLE-ai/cicd-templates/wiki/Quick-start
# Food Security Sandbox - app server (auth, chat, models, farmer-server gateway)
schema-version: 3
# Image name AND Tapis pod ID (ghcr.io/icicle-ai/fssback, pod fssback).
service-name: fssback
# Becomes the image tag. Bump for every deployable build.
service-version: 1.0.0
project-name: food-security-sandbox
service-type: domain
runtime-type: python
runtime-version: "3.12.15"
include-dev-dependencies: false
build-apt-packages: []
runtime-apt-packages: []
